<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adrian Balderas — Resume</title>
  <meta name="description" content="Adrian Balderas — MSc. AI · Machine Learning Engineer">
  <meta property="og:title" content="Adrian Balderas — Resume">
  <meta property="og:description" content="MSc. Artificial Intelligence · Machine Learning Engineer · Edge AI & Computer Vision">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #111111;
      --accent:  #222222;
      --text:    #000000;
      --sub:     #1a1a1a;
      --muted:   #555555;
      --border:  #999999;
      --bg:      #d8d8d8;
      --card:    #ffffff;
    }

    body {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 14px;
    }

    /* ── Controls Bar ── */
    .controls {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0f2444;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .controls-title {
      margin-right: auto;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 16px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background 0.15s, transform 0.1s;
      line-height: 1;
    }

    .btn:active { transform: scale(0.97); }

    .btn-lang {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .btn-lang:hover { background: rgba(255,255,255,0.22); }

    .btn-pdf {
      background: #1d4ed8;
      color: #fff;
    }
    .btn-pdf:hover { background: #1e40af; }

    /* ── Resume Container ── */
    .container {
      max-width: 880px;
      margin: 36px auto 52px;
      background: var(--card);
      border-radius: 10px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.09);
      padding: 52px 60px;
    }

    /* ── Resume Content ── */

    /* Name */
    #resume-content h1 {
      font-size: 2.3em;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    /* Professional title (p right after h1) */
    #resume-content h1 + p {
      text-align: center;
      font-size: 0.97em;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 6px;
    }

    /* Contact line (second p after h1) */
    #resume-content h1 + p + p {
      text-align: center;
      font-size: 0.85em;
      color: var(--muted);
      margin-bottom: 0;
    }

    #resume-content h1 + p + p a {
      color: var(--accent);
      text-decoration: none;
    }
    #resume-content h1 + p + p a:hover { text-decoration: underline; }

    /* Dividers */
    #resume-content hr {
      border: none;
      border-top: 1.5px solid var(--border);
      margin: 20px 0;
    }

    /* Section headers */
    #resume-content h2 {
      font-size: 0.73em;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #000;
      padding-bottom: 5px;
      border-bottom: 1.5px solid #000;
      margin: 28px 0 14px;
    }

    /* Company / Institution names */
    #resume-content h3 {
      font-size: 1em;
      font-weight: 700;
      color: var(--text);
      margin: 16px 0 6px;
    }

    /* Job title line with dates — flex so dates float right */
    #resume-content h4 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.92em;
      font-weight: 600;
      color: #000;
      margin: 10px 0 4px;
    }

    #resume-content h4 em {
      font-style: normal;
      font-weight: 400;
      color: #444;
      font-size: 0.88em;
      flex-shrink: 0;
      margin-left: 10px;
    }

    /* Body text */
    #resume-content p {
      font-size: 0.9em;
      color: var(--sub);
      margin-bottom: 7px;
      text-align: justify;
      hyphens: auto;
    }

    #resume-content strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Bullet lists */
    #resume-content ul {
      margin: 6px 0 10px 18px;
    }

    #resume-content li {
      font-size: 0.9em;
      color: var(--sub);
      margin-bottom: 4px;
      line-height: 1.55;
    }

    #resume-content li::marker { color: #000; }

    #resume-content a { color: #000; }

    /* ── Print / PDF  (letter 8.5" × 11", one page) ── */
    @media print {
      @page {
        size: letter;
        margin: 0.30in 0.40in;
      }

      body {
        background: white;
        font-size: 8pt;
        line-height: 1.38;
        color: #000;
      }

      .controls { display: none !important; }

      .container {
        max-width: 100%;
        margin: 0;
        padding: 0;
        box-shadow: none;
        border-radius: 0;
      }

      #resume-content h1         { font-size: 1.75em; margin-bottom: 3px; }
      #resume-content h1 + p     { margin-bottom: 2px; }
      #resume-content h1 + p + p { margin-bottom: 0; }

      #resume-content hr  { margin: 10px 0; }

      #resume-content h2 {
        font-size: 0.7em;
        margin: 9px 0 7px;
        padding-bottom: 3px;
        page-break-after: avoid;
      }

      #resume-content h3 {
        font-size: 0.97em;
        margin: 8px 0 3px;
        page-break-after: avoid;
      }

      #resume-content h4 {
        font-size: 0.9em;
        margin: 5px 0 2px;
        page-break-after: avoid;
      }

      #resume-content p   { font-size: 0.9em; margin-bottom: 3px; }
      #resume-content ul  { margin: 3px 0 5px 15px; page-break-inside: avoid; }
      #resume-content li  { font-size: 0.9em; margin-bottom: 2px; }
      #resume-content a   { color: #000; text-decoration: none; }
    }

    /* ── Mobile ── */
    @media (max-width: 680px) {
      .container { margin: 0; border-radius: 0; padding: 32px 20px; box-shadow: none; }
      .controls-title { display: none; }
    }
  </style>
</head>
<body>

  <nav class="controls" aria-label="Resume controls">
    <span class="controls-title">Adrian Balderas · Resume</span>
    <button class="btn btn-lang" id="langToggle">🌐 Español</button>
    <button class="btn btn-pdf"  id="downloadPdf">⬇ PDF</button>
  </nav>

  <main class="container">
    <div id="resume-content" aria-live="polite">
      <p style="text-align:center;padding:60px 0;color:var(--muted);">Loading…</p>
    </div>
  </main>

  <script>
    marked.setOptions({ gfm: true });

    const labels = {
      en: { toggle: '🌐 Español', pdf: '⬇ PDF', title: 'Adrian Balderas — Resume' },
      es: { toggle: '🌐 English', pdf: '⬇ PDF', title: 'Adrian Balderas — Currículum' }
    };

    let lang = navigator.language.toLowerCase().startsWith('es') ? 'es' : 'en';

    async function loadResume(l) {
      try {
        const res = await fetch(`resume_${l}.md`);
        if (!res.ok) throw new Error();
        const md = await res.text();
        document.getElementById('resume-content').innerHTML = marked.parse(md);
      } catch {
        document.getElementById('resume-content').innerHTML =
          `<p style="text-align:center;padding:40px;color:#ef4444;">
             Could not load <code>resume_${l}.md</code>
           </p>`;
      }
      document.documentElement.lang = l;
      document.title = labels[l].title;
      document.getElementById('langToggle').textContent = labels[l].toggle;
      lang = l;
    }

    document.getElementById('langToggle').addEventListener('click', () => {
      loadResume(lang === 'en' ? 'es' : 'en');
    });

    document.getElementById('downloadPdf').addEventListener('click', () => {
      window.print();
    });

    loadResume(lang);
  </script>

</body>
</html>
